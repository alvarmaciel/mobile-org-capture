[project]
name = "mobile-org-capture"
version = "0.1.0"
description = "Durable personal Telegram capture inbox for Org"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot==22.8"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
